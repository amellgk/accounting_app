name: 编译 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 诊断环境
        run: |
          flutter doctor -v 2>&1 | tee /tmp/doctor.log
          echo "---"
          cat /tmp/doctor.log
        shell: bash

      - name: 创建标准 Flutter 项目
        run: |
          cd /tmp
          flutter create --org com.accounting --project-name accounting_app temp_app 2>&1
          echo "--- 标准项目文件列表 ---"
          ls -la /tmp/temp_app/android/app/

      - name: 替换为我们的代码
        run: |
          rm -rf /tmp/temp_app/lib
          rm -f /tmp/temp_app/pubspec.yaml
          cp -r ${{ github.workspace }}/flutter_app/lib /tmp/temp_app/lib
          cp ${{ github.workspace }}/flutter_app/pubspec.yaml /tmp/temp_app/pubspec.yaml
          echo "代码替换完成"

      - name: 安装依赖
        run: |
          cd /tmp/temp_app
          flutter pub get 2>&1

      - name: 编译 APK
        run: |
          cd /tmp/temp_app
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          echo "EXIT_CODE=$?"
        shell: bash

      - name: 上传编译日志（即使失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: /tmp/build.log

      - name: 上传诊断日志（即使失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 环境诊断日志
          path: /tmp/doctor.log

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 记账App-APK
          path: /tmp/temp_app/build/app/outputs/flutter-apk/*.apk
